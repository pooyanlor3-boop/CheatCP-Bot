<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>PhoenixCheat | در حال بروزرسانی</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body {
    background-color: #0a0a0a;
    background-image: radial-gradient(ellipse at top, rgba(230,0,0,0.2), transparent 60%);
    color: #fff;
    font-family: 'Vazirmatn', Tahoma, sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
}
.card {
    background: linear-gradient(145deg, #1a1a1a, #0d0d0d);
    border: 1px solid rgba(230,0,0,0.4);
    border-radius: 24px;
    padding: 40px 25px;
    max-width: 420px;
    width: 100%;
    text-align: center;
    box-shadow: 0 15px 50px rgba(0,0,0,0.8), 0 0 30px rgba(230,0,0,0.1);
}
.logo {
    font-size: 60px;
    margin-bottom: 20px;
    animation: pulse 2s infinite alternate;
}
@keyframes pulse {
    0% { transform: scale(1); text-shadow: 0 0 15px #ff4500; }
    100% { transform: scale(1.1); text-shadow: 0 0 30px #00bfff; }
}
h1 {
    font-size: 22px;
    font-weight: 900;
    color: #ffaa00;
    margin-bottom: 15px;
}
p {
    font-size: 14px;
    line-height: 2;
    color: #ccc;
    margin-bottom: 30px;
}
.btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    width: 100%;
    padding: 16px;
    border-radius: 14px;
    font-size: 15px;
    font-weight: 900;
    text-decoration: none;
    margin-bottom: 15px;
    transition: 0.3s;
    font-family: inherit;
}
.btn-support {
    background: linear-gradient(90deg, #00a8ff, #0052d4);
    color: #fff;
    box-shadow: 0 5px 20px rgba(0,168,255,0.3);
}
.btn-support:hover { transform: translateY(-3px); box-shadow: 0 8px 25px rgba(0,168,255,0.6); }

.btn-channel {
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,107,0,0.6);
    color: #ff6b00;
}
.btn-channel:hover { background: rgba(255,107,0,0.1); transform: translateY(-3px); }

svg { width: 22px; height: 22px; }
</style>
</head>
<body>

<div class="card">
    <div class="logo">⚡</div>
    <h1>سایت در حال بروزرسانی است</h1>
    <p>
        سلام دوست عزیز،<br>
        سایت در حال آپدیت هست. برای خرید می‌تونید به پیوی ادمین پیام بدید و یا برای اطلاع از زمان بازگشایی، در کانال اصلی عضو بشید.
    </p>

    <a href="https://rubika.ir/My_HINATA" target="_blank" class="btn btn-support">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path></svg>
        پیام به پشتیبانی (ادمین)
    </a>

    <a href="https://rubika.ir/PhoenixCheat" target="_blank" class="btn btn-channel">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
        عضویت در کانال اصلی
    </a>
</div>

</body>
</html>
